
name: Build Smart Billing APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Smart_Billing_Android_Source.zip -d project
            - name: Check Android SDK versions
        run: |
          find project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print
          grep -RInE 'compileSdk|targetSdk|targetSdkVersion|compileSdkVersion' project --include='build.gradle' --include='build.gradle.kts' || true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
        

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBilling-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
